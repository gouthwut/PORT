[package]
name = "port-launcher"
version = "0.1.0-beta.2"
description = "Windows catalog and download manager for independent ports and runtime projects"
license = "MIT"
edition = "2021"

[features]
download-e2e-qa = []
local-cms-qa = ["reqwest/native-tls"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.11"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["webp", "ico", "png"] }
tempfile = "3"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.14.1"
semver = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
