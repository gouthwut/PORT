name: Feature Request
description: Suggest an idea or enhancement for PORT
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for new features or improvements to PORT.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or missing workflow?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
