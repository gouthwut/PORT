name: Bug Report
description: Create a report to help us improve PORT
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug in PORT!
  - type: input
    id: version
    attributes:
      label: PORT Version
      description: What version of PORT are you running? (e.g., 0.1.0-beta.1)
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What Windows version are you on?
      placeholder: Windows 11 (23H2 x64)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Open PORT
        2. Go to '...'
        3. Click on '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
